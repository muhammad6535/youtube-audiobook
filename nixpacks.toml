[phases.install]
nixPkgs = ["nodejs_20", "python3", "python3.pkgs.pip", "ffmpeg"]

[phases.setup]
commands = [
  "cd frontend && rm -rf node_modules package-lock.json && npm install"
]

[phases.build]
commands = [
  "cd frontend && npx vite build",
  "cd backend && pip install --break-system-packages -r requirements.txt"
]

[start]
cmd = "cd backend && python -m uvicorn app:app --host 0.0.0.0 --port $PORT"
